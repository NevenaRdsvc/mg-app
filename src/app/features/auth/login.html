<div class="login-page">
  <div class="login-box">
    <div class="login-brand">
      <span class="brand-mark">OM</span>
      <span>Order Management</span>
    </div>

    <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Sign in</h1>

      @if (error()) {
        <div class="banner banner-danger" role="alert">
          <om-icon name="alert" />
          <div>{{ error() }}</div>
        </div>
      }

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" formControlName="email" autocomplete="username" autofocus />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field-error">Enter a valid email address.</small>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <span class="password-input">
          <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button type="button" class="icon-btn" (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()">
            <om-icon [name]="showPassword() ? 'eyeOff' : 'eye'" [size]="16" />
          </button>
        </span>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field-error">Password is required.</small>
        }
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="rememberMe" />
        Remember me
      </label>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
